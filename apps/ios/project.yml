name: Arcaevo
options:
  bundleIdPrefix: co.arcaevo
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.1.0"

# Swift Package dependencies. Sentry (crash + error observability) is pinned to
# a recent 8.x. It is only ever INITIALISED when a SENTRY_DSN is configured
# (see Telemetry.swift + the per-config SENTRY_DSN build setting) — the package
# links, but does nothing without a DSN.
packages:
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    from: "8.40.0"

targets:
  # ---------------------------------------------------------------
  # iOS app
  # ---------------------------------------------------------------
  Arcaevo:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      # The whole Arcaevo group, including Arcaevo/Assets.xcassets — the
      # asset catalog (AppIcon single-size 1024 + BrandMark vector SVG). A
      # directory source pulls the .xcassets in and xcodegen auto-assigns it
      # to the resources build phase, so actool compiles it into Assets.car.
      - path: Arcaevo
      # ArcaevoKit is a shared sources group compiled into both the
      # iOS and watchOS targets (models + API client + demo data).
      - path: ArcaevoKit
      # Bundled OFL fonts (Instrument Serif, Hanken Grotesk, Geist Mono) —
      # copied as loose resources so UIAppFonts finds them by file name.
      - path: Fonts
        buildPhase: resources
    dependencies:
      # Embedding the watch app is what pairs the two for WatchConnectivity —
      # the golden-watch-login token handoff (WCSession.updateApplicationContext,
      # PhoneWatchConnectivity ↔ WatchConnectivityManager). WCSession needs NO
      # special entitlement; it only requires the watch app to be embedded/paired,
      # which this dependency provides. The `WatchConnectivity.framework` is
      # linked automatically via Swift's `import WatchConnectivity` autolinking.
      - target: ArcaevoWatch
      # iOS Lock Screen + Home Screen widgets (WidgetKit app extension).
      # Reads the App-Group GlanceSnapshot the app writes after every compute.
      # app-extension products auto-embed into the host app's "Embed
      # Foundation Extensions" copy phase.
      - target: ArcaevoWidgets
      # Crash + error observability (privacy-first; DSN-gated, OFF without one).
      - package: Sentry
        product: Sentry
    entitlements:
      path: Arcaevo/Arcaevo.entitlements
      properties:
        com.apple.developer.healthkit: true
        # Shared App Group container. The app writes GlanceSnapshot here after
        # every readiness/energy compute; the iOS widget extension reads it.
        com.apple.security.application-groups:
          - group.co.arcaevo.app
        # TODO(universal links): needs a real Apple Developer team +
        # apple-app-site-association hosted at https://arcaevo.com before
        # this can be enabled. Uncomment when signing with a real team:
        # com.apple.developer.associated-domains:
        #   - applinks:arcaevo.com
    # Per-configuration Info.plist so App Transport Security can differ by
    # build: Info-Debug.plist keeps the localhost/local-networking exception
    # for dev; Info-Release.plist ships NO ATS exceptions (full ATS, HTTPS
    # only). The API base URL is read from the ARCAEVO_API_BASE_URL build
    # setting below (Debug → http://localhost:3000, Release → https://arcaevo.com)
    # via `$(ARCAEVO_API_BASE_URL)` in each plist. See ArcaevoKit/APIClient.swift.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.arcaevo.app
        TARGETED_DEVICE_FAMILY: "1"
        # Use the App Icon compiled from Assets.xcassets/AppIcon.appiconset
        # (single-size 1024 "A" mark on cream). Without this the app falls
        # back to the blank default icon.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          INFOPLIST_FILE: Arcaevo/Info-Debug.plist
          ARCAEVO_API_BASE_URL: http://localhost:3000/api/v1
          # Empty by default → Sentry stays OFF. Set per-developer/CI to enable.
          SENTRY_DSN: ""
        Release:
          INFOPLIST_FILE: Arcaevo/Info-Release.plist
          ARCAEVO_API_BASE_URL: https://arcaevo.com/api/v1
          # Empty by default → Sentry stays OFF. Supply the production DSN here
          # (or via an xcconfig / CI secret) to turn on crash reporting.
          SENTRY_DSN: ""

  # ---------------------------------------------------------------
  # watchOS companion app (single-target watchOS app, watchOS 10+)
  # ---------------------------------------------------------------
  ArcaevoWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      # Includes ArcaevoWatch/Assets.xcassets (BrandMark vector) — bundled as
      # a resource so the wrist can show the real brand chip on its black setup
      # screen. No AppIcon here (the watch icon is out of scope for this change).
      - path: ArcaevoWatch
      - path: ArcaevoKit
      - path: Fonts
        buildPhase: resources
    dependencies:
      # Watch accessory complication extension (WidgetKit on watchOS). Embeds
      # into the watch app; reads the App-Group GlanceSnapshot the watch writes.
      - target: ArcaevoWatchWidgets
    entitlements:
      path: ArcaevoWatch/ArcaevoWatch.entitlements
      properties:
        # Same App Group as the phone (on the watch's own container): the watch
        # app writes its GlanceSnapshot here; the complication extension reads it.
        com.apple.security.application-groups:
          - group.co.arcaevo.app
    info:
      path: ArcaevoWatch/Info.plist
      properties:
        CFBundleDisplayName: Arcaevo
        WKApplication: true
        WKCompanionAppBundleIdentifier: co.arcaevo.app
        # API base URL from the per-config build setting below (Debug →
        # http://localhost:3000, Release → https://arcaevo.com).
        ARCAEVO_API_BASE_URL: $(ARCAEVO_API_BASE_URL)
        # ATS: allow LOCAL networking only, so the Debug build's real golden-
        # watch-login calls can reach the dev backend at http://localhost:3000
        # from the watch simulator (localhost resolves to the host). This key
        # exempts ONLY loopback / link-local / *.local hosts — public HTTPS
        # (the Release base URL) stays fully ATS-enforced, so Release behaviour
        # is unchanged. A single Info.plist is shared across configs.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIAppFonts:
          - InstrumentSerif-Regular.ttf
          - InstrumentSerif-Italic.ttf
          - HankenGrotesk-Light.ttf
          - HankenGrotesk-Regular.ttf
          - HankenGrotesk-Medium.ttf
          - HankenGrotesk-SemiBold.ttf
          - HankenGrotesk-Bold.ttf
          - HankenGrotesk-ExtraBold.ttf
          - GeistMono-Regular.ttf
          - GeistMono-Medium.ttf
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.arcaevo.app.watchkitapp
        # The watch catalog carries only BrandMark (no AppIcon — the watch
        # icon is out of scope here). Clear the default "AppIcon" name so
        # actool doesn't fail looking for an app-icon set that isn't there.
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
      configs:
        Debug:
          ARCAEVO_API_BASE_URL: http://localhost:3000/api/v1
        Release:
          ARCAEVO_API_BASE_URL: https://arcaevo.com/api/v1

  # ---------------------------------------------------------------
  # iOS widget extension — Lock Screen + Home Screen widgets
  # (readiness ring, energy gauge, HRV/RHR mini, next-test countdown).
  # Lightweight: Foundation + SwiftUI + WidgetKit only. It reads the
  # App-Group GlanceSnapshot the app writes; it does NOT link ArcaevoKit
  # (a local snapshot DTO decodes the same JSON), so the extension stays tiny.
  # ---------------------------------------------------------------
  ArcaevoWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ArcaevoWidgets
    info:
      path: ArcaevoWidgets/Info.plist
      properties:
        CFBundleDisplayName: Arcaevo
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: ArcaevoWidgets/ArcaevoWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.co.arcaevo.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.arcaevo.app.widgets
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: NO
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework

  # ---------------------------------------------------------------
  # watchOS accessory complication extension — the real WidgetKit
  # complication that Phase 17 deferred. Families: circular / corner /
  # rectangular / inline, showing readiness / energy / next-test. Reads the
  # App-Group GlanceSnapshot the watch app writes; also lightweight (no ArcaevoKit).
  # ---------------------------------------------------------------
  ArcaevoWatchWidgets:
    type: app-extension
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: ArcaevoWatchWidgets
    info:
      path: ArcaevoWatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: Arcaevo
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: ArcaevoWatchWidgets/ArcaevoWatchWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.co.arcaevo.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.arcaevo.app.watchkitapp.complications
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: NO
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework

  # ---------------------------------------------------------------
  # Phase 22 engine regression suite — XCTest unit tests for the
  # daily-engagement engines (the core IP). HOSTLESS logic tests: the
  # target compiles the ArcaevoKit engine sources directly (same as the
  # app/watch targets do), so `xcodebuild test` runs pure deterministic
  # maths with NO app launch, NO HealthKit, NO network, NO host-app flake.
  # Test-only: it links nothing from the app/watch/widget targets.
  # ---------------------------------------------------------------
  ArcaevoKitTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ArcaevoKitTests
      # The engines under test — compiled straight into the test bundle so
      # the suite is a standalone logic-test module (no @testable host).
      - path: ArcaevoKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.arcaevo.kit.tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"

schemes:
  Arcaevo:
    build:
      targets:
        Arcaevo: all
    run:
      config: Debug
    archive:
      config: Release
  ArcaevoWatch:
    build:
      targets:
        ArcaevoWatch: all
    run:
      config: Debug
    archive:
      config: Release
  ArcaevoKitTests:
    build:
      targets:
        ArcaevoKitTests: all
    test:
      targets:
        - ArcaevoKitTests
      gatherCoverageData: false
