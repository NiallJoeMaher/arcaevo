<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1180,&quot;height&quot;:72},&quot;active&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active || "";
    const base = "text-decoration:none; font-size:14px; letter-spacing:-0.005em; transition:color .15s;";
    const items = [
      { key: "how", href: "HowItWorks.dc.html", label: "How it works" },
      { key: "pricing", href: "Pricing.dc.html", label: "Pricing" },
      { key: "science", href: "Science.dc.html", label: "Science" },
      { key: "app", href: "App.dc.html", label: "The app" },
      { key: "compare", href: "Compare.dc.html", label: "Compare" },
      { key: "blog", href: "Blog.dc.html", label: "Blog" },
    ];
    const links = items.map(function (it) {
      const on = it.key === active;
      return {
        href: it.href,
        label: it.label,
        style: base + (on ? "color:#1E5C45; font-weight:600;" : "color:#4A554D; font-weight:500;"),
      };
    });
    return { links: links };
  }
}
</script>
