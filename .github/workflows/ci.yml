name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Web — typecheck, unit, build, e2e
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    services:
      mongo:
        image: mongo:7
        ports:
          - 27019:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: E2E (builds and serves the production bundle)
        run: npm run e2e
        env:
          MONGODB_URI: mongodb://localhost:27019/arcaevo
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: apps/web/test-results/
          retention-days: 7

  cdk:
    name: Infra — cdk synth
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/cdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: infra/cdk/package-lock.json
      - run: npm ci
      - run: npx cdk synth

  ios:
    name: iOS + watchOS — xcodebuild
    runs-on: macos-15
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build iOS app
        run: >
          xcodebuild -project Arcaevo.xcodeproj -scheme Arcaevo
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build
      - name: Build watch app
        run: >
          xcodebuild -project Arcaevo.xcodeproj -scheme ArcaevoWatch
          -destination 'generic/platform=watchOS Simulator'
          CODE_SIGNING_ALLOWED=NO build

  docker:
    name: Docker — compose config + image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config -q
      - run: docker build -t arcaevo-web apps/web
