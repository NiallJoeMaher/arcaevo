<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<nav style="position:sticky; top:0; z-index:50; background:rgba(236,231,221,0.82); backdrop-filter:saturate(140%) blur(14px); border-bottom:1px solid rgba(28,38,32,0.10); font-family:'Hanken Grotesk',sans-serif;">
  <div style="max-width:1180px; margin:0 auto; display:flex; justify-content:space-between; align-items:center; padding:16px 40px; gap:24px;">
    <a href="Home.dc.html" style="display:flex; align-items:center; gap:11px; text-decoration:none; color:#1C2620; flex-shrink:0;">
      <span style="font-weight:600; font-size:19px; letter-spacing:-0.01em;">Arcaevo</span>
    </a>
    <div style="display:flex; gap:28px; align-items:center;">
      <sc-for list="{{ links }}" as="link" hint-placeholder-count="6">
        <a href="{{ link.href }}" style="{{ link.style }}">{{ link.label }}</a>
      </sc-for>
    </div>
    <a href="Pricing.dc.html" style="background:#1C2620; color:#F4F1EA; padding:10px 20px; border-radius:100px; font-size:13.5px; font-weight:600; text-decoration:none; flex-shrink:0;">Start membership</a>
  </div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1180,&quot;height&quot;:72},&quot;active&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active || "";
    const base = "text-decoration:none; font-size:14px; letter-spacing:-0.005em; transition:color .15s;";
    const items = [
      { key: "how", href: "HowItWorks.dc.html", label: "How it works" },
      { key: "pricing", href: "Pricing.dc.html", label: "Pricing" },
      { key: "science", href: "Science.dc.html", label: "Science" },
      { key: "app", href: "App.dc.html", label: "The app" },
      { key: "compare", href: "Compare.dc.html", label: "Compare" },
      { key: "blog", href: "Blog.dc.html", label: "Blog" },
    ];
    const links = items.map(function (it) {
      const on = it.key === active;
      return {
        href: it.href,
        label: it.label,
        style: base + (on ? "color:#1E5C45; font-weight:600;" : "color:#4A554D; font-weight:500;"),
      };
    });
    return { links: links };
  }
}
</script>
</body>
</html>
