name: Arcaevo
options:
  bundleIdPrefix: co.arcaevo
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.1.0"

targets:
  # ---------------------------------------------------------------
  # iOS app
  # ---------------------------------------------------------------
  Arcaevo:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Arcaevo
      # ArcaevoKit is a shared sources group compiled into both the
      # iOS and watchOS targets (models + API client + demo data).
      - path: ArcaevoKit
      # Bundled OFL fonts (Instrument Serif, Hanken Grotesk, Geist Mono) —
      # copied as loose resources so UIAppFonts finds them by file name.
      - path: Fonts
        buildPhase: resources
    dependencies:
      - target: ArcaevoWatch
    entitlements:
      path: Arcaevo/Arcaevo.entitlements
      properties:
        com.apple.developer.healthkit: true
        # TODO(universal links): needs a real Apple Developer team +
        # apple-app-site-association hosted at https://arcaevo.com before
        # this can be enabled. Uncomment when signing with a real team:
        # com.apple.developer.associated-domains:
        #   - applinks:arcaevo.com
    info:
      path: Arcaevo/Info.plist
      properties:
        CFBundleDisplayName: Arcaevo
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Custom URL scheme fallback for magic-link verification while the
        # associated-domains entitlement (universal links) is unavailable:
        # arcaevo://verify?token=…
        CFBundleURLTypes:
          - CFBundleURLName: co.arcaevo.app
            CFBundleURLSchemes:
              - arcaevo
        UIAppFonts:
          - InstrumentSerif-Regular.ttf
          - InstrumentSerif-Italic.ttf
          - HankenGrotesk-Light.ttf
          - HankenGrotesk-Regular.ttf
          - HankenGrotesk-Medium.ttf
          - HankenGrotesk-SemiBold.ttf
          - HankenGrotesk-Bold.ttf
          - HankenGrotesk-ExtraBold.ttf
          - GeistMono-Regular.ttf
          - GeistMono-Medium.ttf
        NSHealthShareUsageDescription: >-
          Arcaevo reads your heart rate variability, resting heart rate,
          sleep and VO2 max from Apple Health to build your personal
          baseline and plain-language insights. Wellness only —
          not a medical device, not a diagnosis.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.arcaevo.app
        TARGETED_DEVICE_FAMILY: "1"

  # ---------------------------------------------------------------
  # watchOS companion app (single-target watchOS app, watchOS 10+)
  # ---------------------------------------------------------------
  ArcaevoWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: ArcaevoWatch
      - path: ArcaevoKit
      - path: Fonts
        buildPhase: resources
    info:
      path: ArcaevoWatch/Info.plist
      properties:
        CFBundleDisplayName: Arcaevo
        WKApplication: true
        WKCompanionAppBundleIdentifier: co.arcaevo.app
        UIAppFonts:
          - InstrumentSerif-Regular.ttf
          - InstrumentSerif-Italic.ttf
          - HankenGrotesk-Light.ttf
          - HankenGrotesk-Regular.ttf
          - HankenGrotesk-Medium.ttf
          - HankenGrotesk-SemiBold.ttf
          - HankenGrotesk-Bold.ttf
          - HankenGrotesk-ExtraBold.ttf
          - GeistMono-Regular.ttf
          - GeistMono-Medium.ttf
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.arcaevo.app.watchkitapp

schemes:
  Arcaevo:
    build:
      targets:
        Arcaevo: all
    run:
      config: Debug
    archive:
      config: Release
  ArcaevoWatch:
    build:
      targets:
        ArcaevoWatch: all
    run:
      config: Debug
    archive:
      config: Release
