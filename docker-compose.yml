services:
  mongo:
    image: mongo:7
    container_name: arcaevo-mongo
    ports:
      # Host 27019 because 27017/27018 are taken by other local Mongo containers
      # (assemblpro-mongodb, eventson-mongo) on this machine.
      # Inside the compose network the web container still uses mongo:27017.
      - "27019:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo-express:
    image: mongo-express:1
    container_name: arcaevo-mongo-express
    ports:
      # Host 8083 — 8081/8082 are held by other projects' mongo-express containers.
      - "8083:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017/
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      mongo:
        condition: service_healthy

  mailhog:
    image: mailhog/mailhog:latest
    container_name: arcaevo-mailhog
    ports:
      # Host 1026 (SMTP) / 8026 (web UI) — the default 1025/8025 pair is held
      # by other local projects' mail catchers (assemblpro-mailhog on
      # 1025/8025; codu-mailpit and eventson-mailhog hold 1027/8027, 1030/8030).
      # Inside the compose network the web container still uses mailhog:1025.
      - "1026:1025"
      - "8026:8025"

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: arcaevo-web
    ports:
      - "3000:3000"
    environment:
      MONGODB_URI: mongodb://mongo:27017/arcaevo
      ADMIN_PASSWORD: change-me-local
      # Dev-only HMAC secret. REQUIRED in production — a real deploy MUST
      # override this with a strong random value (the app fails to boot without
      # SESSION_SECRET when NODE_ENV=production; there is no committed fallback).
      SESSION_SECRET: dev-only-compose-secret-override-in-prod
      # This local stack builds with NODE_ENV=production, but it is a dev
      # environment: opt back into the demo bearer token and the open (secretless)
      # mock webhooks the client-fired checkout uses. A real deploy sets NEITHER
      # of these and configures STRIPE_WEBHOOK_SECRET / LETSGETCHECKED_WEBHOOK_SECRET.
      ALLOW_DEMO_TOKEN: "true"
      ALLOW_OPEN_WEBHOOKS: "true"
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      # Emails ALWAYS land in the Mongo `outbox`; with EMAIL_PROVIDER=mailhog
      # they are ADDITIONALLY delivered over SMTP to the mailhog container —
      # browse them at http://localhost:8026.
      EMAIL_PROVIDER: mailhog
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
    depends_on:
      mongo:
        condition: service_healthy
      mailhog:
        condition: service_started

volumes:
  mongo-data:
