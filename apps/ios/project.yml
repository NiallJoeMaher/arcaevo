name: Arcaevo
options:
  bundleIdPrefix: co.arcaevo
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.1.0"

targets:
  # ---------------------------------------------------------------
  # iOS app
  # ---------------------------------------------------------------
  Arcaevo:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Arcaevo
      # ArcaevoKit is a shared sources group compiled into both the
      # iOS and watchOS targets (models + API client + demo data).
      - path: ArcaevoKit
      # Bundled OFL fonts (Instrument Serif, Hanken Grotesk, Geist Mono) —
      # copied as loose resources so UIAppFonts finds them by file name.
      - path: Fonts
        buildPhase: resources
    dependencies:
      # Embedding the watch app is what pairs the two for WatchConnectivity —
      # the golden-watch-login token handoff (WCSession.updateApplicationContext,
      # PhoneWatchConnectivity ↔ WatchConnectivityManager). WCSession needs NO
      # special entitlement; it only requires the watch app to be embedded/paired,
      # which this dependency provides. The `WatchConnectivity.framework` is
      # linked automatically via Swift's `import WatchConnectivity` autolinking.
      - target: ArcaevoWatch
    entitlements:
      path: Arcaevo/Arcaevo.entitlements
      properties:
        com.apple.developer.healthkit: true
        # TODO(universal links): needs a real Apple Developer team +
        # apple-app-site-association hosted at https://arcaevo.com before
        # this can be enabled. Uncomment when signing with a real team:
        # com.apple.developer.associated-domains:
        #   - applinks:arcaevo.com
    # Per-configuration Info.plist so App Transport Security can differ by
    # build: Info-Debug.plist keeps the localhost/local-networking exception
    # for dev; Info-Release.plist ships NO ATS exceptions (full ATS, HTTPS
    # only). The API base URL is read from the ARCAEVO_API_BASE_URL build
    # setting below (Debug → http://localhost:3000, Release → https://arcaevo.com)
    # via `$(ARCAEVO_API_BASE_URL)` in each plist. See ArcaevoKit/APIClient.swift.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.arcaevo.app
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        Debug:
          INFOPLIST_FILE: Arcaevo/Info-Debug.plist
          ARCAEVO_API_BASE_URL: http://localhost:3000/api/v1
        Release:
          INFOPLIST_FILE: Arcaevo/Info-Release.plist
          ARCAEVO_API_BASE_URL: https://arcaevo.com/api/v1

  # ---------------------------------------------------------------
  # watchOS companion app (single-target watchOS app, watchOS 10+)
  # ---------------------------------------------------------------
  ArcaevoWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: ArcaevoWatch
      - path: ArcaevoKit
      - path: Fonts
        buildPhase: resources
    info:
      path: ArcaevoWatch/Info.plist
      properties:
        CFBundleDisplayName: Arcaevo
        WKApplication: true
        WKCompanionAppBundleIdentifier: co.arcaevo.app
        # API base URL from the per-config build setting below. No ATS
        # exception ships: full App Transport Security is enforced (HTTPS
        # only) in both configs. The watch's backend calls are best-effort
        # and it demos from seeded data regardless, so it needs no localhost
        # HTTP exception.
        ARCAEVO_API_BASE_URL: $(ARCAEVO_API_BASE_URL)
        UIAppFonts:
          - InstrumentSerif-Regular.ttf
          - InstrumentSerif-Italic.ttf
          - HankenGrotesk-Light.ttf
          - HankenGrotesk-Regular.ttf
          - HankenGrotesk-Medium.ttf
          - HankenGrotesk-SemiBold.ttf
          - HankenGrotesk-Bold.ttf
          - HankenGrotesk-ExtraBold.ttf
          - GeistMono-Regular.ttf
          - GeistMono-Medium.ttf
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.arcaevo.app.watchkitapp
      configs:
        Debug:
          ARCAEVO_API_BASE_URL: http://localhost:3000/api/v1
        Release:
          ARCAEVO_API_BASE_URL: https://arcaevo.com/api/v1

schemes:
  Arcaevo:
    build:
      targets:
        Arcaevo: all
    run:
      config: Debug
    archive:
      config: Release
  ArcaevoWatch:
    build:
      targets:
        ArcaevoWatch: all
    run:
      config: Debug
    archive:
      config: Release
